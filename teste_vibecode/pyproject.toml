[project]
name = "festa-ifc"
version = "1.0.0"
description = "Planejamento da festa do IFC Campus Blumenau"
requires-python = ">=3.12,<3.14"
dependencies = [
    "streamlit>=1.45,<2",
    "SQLAlchemy>=2.0.40,<2.1",
    "PyMySQL[rsa]>=1.1,<2",
    "python-dotenv>=1.1,<2",
    "tzdata>=2025.1",
]

[dependency-groups]
dev = ["pytest>=8.3,<10"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["src/tests"]
addopts = "-q"
